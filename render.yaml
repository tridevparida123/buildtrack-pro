services:
  - type: web
    name: buildtrack-pro
    env: java
    buildCommand: ./mvnw clean package -DskipTests || mvn clean package -DskipTests
    startCommand: java -jar target/nova-construct-1.0.0-SNAPSHOT.jar
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
