# Server & Host Configuration (Render requirement: Bind to 0.0.0.0)
server.port=${PORT:8080}
server.address=0.0.0.0

# Spring Application Name
spring.application.name=buildtrack-pro

# Database Configuration with Zero-Config Fallback (H2 in-memory fallback if no cloud DB specified)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:novaconstruct;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console Enablement
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Template Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# File Upload Settings
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
