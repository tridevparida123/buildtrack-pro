<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Governance &amp; Roles Directory - Nova Construct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/nova-theme.css}" href="/css/nova-theme.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <div th:replace="~{components/navbar :: navbar}"></div>
  <div th:replace="~{components/messages :: messages}"></div>

  <main class="flex-grow-1 w-100" style="min-width: 0;">
    <div class="nova-container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <span class="hero-eyebrow mb-1">STAFF GOVERNANCE / RBAC DIRECTORY</span>
          <h2 class="font-heading fw-bold mb-1">Personnel &amp; Operational Roles</h2>
          <p class="text-muted small mb-0">Role-Based Access Control matrix for Super Admins, Managers, Accountants, Legal Officers, and Site Supervisors.</p>
        </div>
      </div>

      <div class="nova-card p-4">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-dark font-heading small">
              <tr>
                <th>Username</th>
                <th>Full Name</th>
                <th>Primary Role</th>
                <th>Organization</th>
                <th>Email</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="u : ${usersList}">
                <td class="font-monospace fw-bold" th:text="${u.username}">username</td>
                <td th:text="${u.fullName}">Full Name</td>
                <td><span class="badge bg-primary" th:text="${u.primaryRole.displayName}">Role</span></td>
                <td th:text="${u.organization}">Organization</td>
                <td class="font-monospace small" th:text="${u.email}">email@domain.com</td>
                <td><span class="badge bg-success" th:text="${u.isApproved ? 'Approved' : 'Pending'}">Approved</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{components/footer :: footer}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
