<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - Nova Construct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/nova-theme.css}" href="/css/nova-theme.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <div th:replace="~{components/navbar :: navbar}"></div>
  <div th:replace="~{components/messages :: messages}"></div>

  <main class="flex-grow-1 w-100" style="min-width: 0;">
    <div class="nova-container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="nova-card p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 border-bottom pb-4 mb-4">
              <div class="bg-dark text-white rounded-circle d-flex align-items-center justify-content-center font-heading fw-bold fs-3" style="width: 64px; height: 64px;">
                <span th:text="${profileUser.username.substring(0, 1).toUpperCase()}">U</span>
              </div>
              <div>
                <h2 class="font-heading fw-bold mb-1" th:text="${profileUser.fullName}">User Name</h2>
                <div class="text-muted small">
                  <span class="badge bg-primary me-2" th:text="${profileUser.primaryRole.displayName}">Role</span>
                  <span class="font-monospace" th:text="${profileUser.email}">email@domain.com</span>
                </div>
              </div>
            </div>

            <h5 class="font-heading fw-bold mb-3">Account Specifications</h5>
            <div class="row g-3 bg-light p-3 rounded-3 border mb-4">
              <div class="col-md-6"><strong>Username:</strong> <span th:text="${profileUser.username}">username</span></div>
              <div class="col-md-6"><strong>Organization:</strong> <span th:text="${profileUser.organization}">Organization</span></div>
              <div class="col-md-6"><strong>Phone Number:</strong> <span th:text="${profileUser.phoneNumber != null ? profileUser.phoneNumber : 'Not provided'}">+91</span></div>
              <div class="col-md-6"><strong>Account Approval:</strong> <span class="badge bg-success" th:text="${profileUser.isApproved ? 'Approved' : 'Pending'}">Approved</span></div>
            </div>

            <div class="d-flex justify-content-end">
              <a th:href="@{/projects}" class="btn btn-outline-dark">Return to Workspace</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{components/footer :: footer}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
