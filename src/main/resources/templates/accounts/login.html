<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Nova Construct Enterprise Work Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/nova-theme.css}" href="/css/nova-theme.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <div th:replace="~{components/navbar :: navbar}"></div>
  <div th:replace="~{components/messages :: messages}"></div>

  <main class="flex-grow-1 w-100" style="min-width: 0;">
    <div class="nova-auth-wrapper">
      <div class="nova-auth-card">
        <div class="text-center mb-4">
          <span class="nova-eyebrow">OPERATIONAL ACCESS / DIGITAL WORK DIARY</span>
          <h2 class="font-heading fs-3 fw-bold mb-2">Welcome Back</h2>
          <p class="text-muted small">Access your multi-project construction management dashboard</p>
        </div>

        <form method="post" th:action="@{/accounts/login}">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold small text-dark">Username or ID</label>
            <input type="text" id="username" name="username" class="form-control form-control-lg fs-6" placeholder="Enter username" required>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="password" class="form-label fw-semibold small text-dark mb-0">Password</label>
            </div>
            <input type="password" id="password" name="password" class="form-control form-control-lg fs-6" placeholder="Enter password" required>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-nova-primary btn-lg fs-6">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Workspace
            </button>
          </div>

          <div class="p-3 bg-light rounded-3 border small text-muted mt-4">
            <div class="fw-bold text-dark mb-1"><i class="bi bi-shield-check text-success me-1"></i> Enterprise Authentication</div>
            <div>Role-Based Access Control (RBAC) enforced for Administrator, Manager, Accountant, Legal Officer, and Supervisor portals.</div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div th:replace="~{components/footer :: footer}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
