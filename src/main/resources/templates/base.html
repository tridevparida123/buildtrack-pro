<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title != null ? title : 'Nova Construct - Real Estate Construction Management'}">Nova Construct - Real Estate Construction Management</title>
  
  <!-- Modern Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Nova Custom Architectural Design System -->
  <link rel="stylesheet" th:href="@{/css/nova-theme.css}" href="/css/nova-theme.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <div th:replace="~{components/navbar :: navbar}"></div>
  <div th:replace="~{components/messages :: messages}"></div>

  <main class="flex-grow-1 w-100" style="min-width: 0;">
    <div th:replace="${contentFragment}"></div>
  </main>

  <div th:replace="~{components/footer :: footer}"></div>

  <!-- Bootstrap 5.3.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Chart.js 4.4.2 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</body>
</html>
