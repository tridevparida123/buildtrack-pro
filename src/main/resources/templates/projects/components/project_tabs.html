<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="project_tabs" class="project-tabs-wrapper" aria-label="Project operational modules">
  <ul class="project-tabs-list">
    <li>
      <a class="project-tab-link" th:classappend="${activeTab == 'dashboard' or activeTab == 'overview' ? 'active' : ''}" th:href="@{'/projects/' + ${project.id} + '?tab=dashboard'}">
        <i class="bi bi-speedometer2"></i> Overview
      </a>
    </li>
    <li>
      <a class="project-tab-link" th:classappend="${activeTab == 'labour-diary' or activeTab == 'labour' ? 'active' : ''}" th:href="@{'/projects/' + ${project.id} + '?tab=labour-diary'}">
        <i class="bi bi-people"></i> Labour Diary
      </a>
    </li>
    <li>
      <a class="project-tab-link" th:classappend="${activeTab == 'materials' ? 'active' : ''}" th:href="@{'/projects/' + ${project.id} + '?tab=materials'}">
        <i class="bi bi-box-seam"></i> Materials
      </a>
    </li>
    <li>
      <a class="project-tab-link" th:classappend="${activeTab == 'ledger' or activeTab == 'finance' ? 'active' : ''}" th:href="@{'/projects/' + ${project.id} + '?tab=ledger'}">
        <i class="bi bi-journal-text"></i> Finance
      </a>
    </li>
    <li>
      <a class="project-tab-link" th:classappend="${activeTab == 'budget' ? 'active' : ''}" th:href="@{'/projects/' + ${project.id} + '?tab=budget'}">
        <i class="bi bi-pie-chart"></i> Budget
      </a>
    </li>
    <li>
      <a class="project-tab-link" th:classappend="${activeTab == 'legal-docs' or activeTab == 'legal' ? 'active' : ''}" th:href="@{'/projects/' + ${project.id} + '?tab=legal-docs'}">
        <i class="bi bi-file-earmark-lock"></i> Legal
      </a>
    </li>
    <li>
      <a class="project-tab-link" th:classappend="${activeTab == 'contacts' or activeTab == 'people' ? 'active' : ''}" th:href="@{'/projects/' + ${project.id} + '?tab=contacts'}">
        <i class="bi bi-person-lines-fill"></i> People
      </a>
    </li>
    <li>
      <a class="project-tab-link" th:classappend="${activeTab == 'daily-diary' or activeTab == 'diary' ? 'active' : ''}" th:href="@{'/projects/' + ${project.id} + '?tab=daily-diary'}">
        <i class="bi bi-camera"></i> Work Diary
      </a>
    </li>
    <li>
      <a class="project-tab-link" th:classappend="${activeTab == 'work-schedule' or activeTab == 'schedule' ? 'active' : ''}" th:href="@{'/projects/' + ${project.id} + '?tab=work-schedule'}">
        <i class="bi bi-calendar-week"></i> Work Plan
      </a>
    </li>
    <li>
      <a class="project-tab-link" th:classappend="${activeTab == 'reports' ? 'active' : ''}" th:href="@{'/projects/' + ${project.id} + '?tab=reports'}">
        <i class="bi bi-bar-chart"></i> Reports
      </a>
    </li>
    <li>
      <a class="project-tab-link" th:classappend="${activeTab == 'settings' ? 'active' : ''}" th:href="@{'/projects/' + ${project.id} + '?tab=settings'}">
        <i class="bi bi-gear"></i> Settings
      </a>
    </li>
  </ul>
</nav>

</body>
</html>
